[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "word-extract"
version = "0.1.0"
description = "Deterministic .docx parse/structure/term-extraction with RAG-routing summaries"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Ivan Ortega"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# docextract-core is released in lockstep; for local work install it editable from ../docextract-core.
dependencies = ["docextract-core>=0.1,<0.2", "lxml>=5"]

[project.scripts]
wordextract = "wordextract.cli:main"

[project.urls]
Homepage = "https://github.com/iortega10/word-extract"
Source = "https://github.com/iortega10/word-extract"
Issues = "https://github.com/iortega10/word-extract/issues"

[project.optional-dependencies]
# python-docx authors the synthetic fixtures (tools/make_fixtures.py); the library itself
# never imports it (design D1: python-docx drops tracked-change text).
dev = ["pytest>=8", "python-docx>=1.2"]
# The MCP framework behind `python -m wordextract serve` (Phase 2, Turn 6): optional so the
# library, CLI and tests run without it -- only wordextract/mcp/ imports it.
mcp = ["mcp>=1.10,<2"]

[tool.setuptools.packages.find]
include = ["wordextract*"]

# The versioned prompt (Phase 2, Turn 1) is data, not code: a summary's prompt_hash is the
# content hash of the file, so the file a summary was written against has to ship with the
# package and stay byte-stable.
[tool.setuptools.package-data]
wordextract = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "docextract-core"]
markers = [
    "spec_derived: reads a fixture whose labels come from a written spec, not the generator",
]
