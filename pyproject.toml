[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-extract"
version = "0.1.0"
description = "Deterministic .docx parse/structure/term-extraction with RAG-routing summaries"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ivan Ortega"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
# docextract-core is a path/editable dependency (see ../docextract-core); declared
# here by name because PEP 621 has no path-dependency syntax.
dependencies = ["docextract-core", "lxml>=5"]

[project.optional-dependencies]
# python-docx authors the synthetic fixtures (tools/make_fixtures.py); the library itself
# never imports it (design D1: python-docx drops tracked-change text).
dev = ["pytest>=8", "python-docx>=1.2"]

[tool.setuptools.packages.find]
include = ["wordextract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "docextract-core"]
markers = [
    "spec_derived: reads a fixture whose labels come from a written spec, not the generator",
]
