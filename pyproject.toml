[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-extract"
version = "0.1.0"
description = "Deterministic .docx parse/structure/term-extraction with RAG-routing summaries"
requires-python = ">=3.11"
# docextract-core is a path/editable dependency (see ../docextract-core); declared
# here by name because PEP 621 has no path-dependency syntax.
dependencies = ["docextract-core"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["wordextract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "docextract-core"]
markers = [
    "spec_derived: reads a fixture whose labels come from a written spec, not the generator",
]
