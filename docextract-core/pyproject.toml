[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docextract-core"
version = "0.1.0rc1"
description = "Shared document-extraction substrate: hashing, JSON codec, archives, LLM protocol"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Ivan Ortega"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/iortega10/word-extract"
Source = "https://github.com/iortega10/word-extract"
Issues = "https://github.com/iortega10/word-extract/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["docextract_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
